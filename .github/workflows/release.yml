name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 0.1.0 or 0.1.0-beta.1" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: bash scripts/make-app.sh "${{ steps.version.outputs.version }}"

      - name: Package app
        shell: bash
        run: |
          ditto -c -k --keepParent build/AutoKeyboard.app "build/AutoKeyboard-${{ steps.version.outputs.version }}.zip"

      - name: Create GitHub release
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "build/AutoKeyboard-${{ steps.version.outputs.version }}.zip" \
            --title "AutoKeyboard ${{ steps.version.outputs.version }}" \
            --notes "AutoKeyboard ${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
